<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadworks | Report Walkthrough</title>
  <style>
    :root {
      --green: #098a3e;
      --green2: #2fb85d;
      --navy: #252844;
      --navy2: #20243e;
      --purple: #7000ff;
      --text: #171a35;
      --muted: #8d93a3;
      --line: #dcdde2;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a { color: inherit; text-decoration: none; }

    .confirmed-bar {
      width: 100%;
      min-height: 69px;
      padding: 0 18px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: clamp(15px, 2.7vw, 25px);
      line-height: 1;
      letter-spacing: .055em;
      font-weight: 900;
      white-space: nowrap;
      text-align: center;
    }

    .confirmed-bar .circle {
      width: 31px;
      height: 31px;
      min-width: 31px;
      border-radius: 999px;
      background: #fff;
      color: var(--green);
      display: inline-grid;
      place-items: center;
      font-size: 21px;
      line-height: 1;
      font-weight: 900;
    }

    .confirmed-bar .soft {
      font-weight: 500;
      letter-spacing: .045em;
    }

    .confirmed-bar u {
      text-underline-offset: 5px;
      text-decoration-thickness: 2px;
    }

    .hero {
      background:
        radial-gradient(circle at 50% -8%, rgba(86,88,145,.34), transparent 36%),
        linear-gradient(180deg, #303352 0%, #252945 52%, #20243e 100%);
      color: #fff;
      min-height: 60vh;
      padding: 42px 0 36px;
      display: flex;
      align-items: center;
    }

    .wrap {
      width: min(650px, calc(100% - 28px));
      margin: 0 auto;
      text-align: center;
    }

    .kicker {
      margin: 0 0 20px;
      color: rgba(255,255,255,.84);
      font-size: 27px;
      line-height: 1.15;
      letter-spacing: -.04em;
      font-weight: 400;
    }

    h1 {
      margin: 0 auto 28px;
      max-width: 650px;
      color: #fff;
      font-size: 41px;
      line-height: 1.08;
      letter-spacing: -.052em;
      font-weight: 900;
    }
h1 span {
      display: block;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
    }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #050505;
      box-shadow: 0 8px 20px rgba(0,0,0,.22);
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
      transform: scale(1.01);
    }

    .video::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.2));
      pointer-events: none;
    }

    .unmute {
      position: absolute;
      z-index: 4;
      cursor: pointer;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -48%);
      width: 68%;
      min-height: 61%;
      border-radius: 13px;
      border: 3px solid rgba(255,255,255,.9);
      background: linear-gradient(135deg, rgba(116,0,255,.92), rgba(154,22,255,.78));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      box-shadow: 0 18px 45px rgba(45,0,120,.28);
      user-select: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .unmute:hover {
      transform: translate(-50%, -48%) scale(1.015);
    }

    .unmute.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -48%) scale(.96);
    }

    .speaker {
      margin-bottom: 15px;
      font-size: 42px;
      line-height: 1;
    }

    .unmute-title {
      font-size: 30px;
      line-height: 1.18;
      letter-spacing: -.04em;
      font-weight: 900;
      text-align: center;
    }
.call-section {
      background: #fff;
      padding: 42px 0 90px;
    }

    .call-wrap {
      width: min(650px, calc(100% - 60px));
      margin: 0 auto;
      text-align: center;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 400px;
      min-height: 68px;
      padding: 12px 36px;
      margin: 0 auto 17px;
      background: var(--green2);
      color: #fff;
      border-radius: 14px 14px 0 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -.035em;
      font-weight: 900;
    }

    h2 {
      margin: 0 auto 38px;
      max-width: 650px;
      color: var(--text);
      font-size: 43px;
      line-height: 1.12;
      letter-spacing: -.055em;
      font-weight: 900;
    }
.iclosed-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 2px 0 rgba(0,0,0,.02);
    }

    .iclosed-card .iclosed-widget {
      width: 100%;
      height: 620px;
      display: block;
    }

    .form-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
      text-align: left;
    }

    .steps {
      min-height: 96px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 0 12px;
      font-size: 25px;
      line-height: 1;
      font-weight: 500;
      color: #a8acb5;
      white-space: nowrap;
    }

    .steps .active {
      color: #1f243d;
    }

    .dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      border-radius: 999px;
      background: var(--purple);
      display: inline-block;
      transform: translateY(-2px);
    }

    .dot.gray {
      margin-left: 2px;
      background: #d4d6dd;
    }

    .form-body {
      padding: 38px 38px 42px;
    }

    .meeting-title {
      margin: 0 0 26px;
      font-size: 33px;
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 900;
      color: var(--text);
    }

    .fields {
      display: grid;
      gap: 15px;
    }

    .field {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      color: #9ca3af;
      font-size: 16px;
      font-weight: 500;
    }

    .button {
      margin-top: 19px;
      width: 100%;
      min-height: 62px;
      border-radius: 8px;
      background: var(--purple);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.01em;
    }

    .fine-print {
      margin: 16px auto 0;
      max-width: 560px;
      color: #7b8190;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 480px) {
      .confirmed-bar {
        min-height: 69px;
        gap: 11px;
        padding: 0 12px;
        font-size: 19px;
        letter-spacing: .035em;
      }

      .confirmed-bar .circle {
        width: 30px;
        height: 30px;
        min-width: 30px;
        font-size: 20px;
      }

      .wrap {
        width: calc(100% - 28px);
      }

      .call-wrap {
        width: calc(100% - 60px);
      }

      .hero {
        min-height: 60vh;
        padding: 34px 0 32px;
      }

      .kicker {
        font-size: 26px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 40px;
        line-height: 1.1;
        margin-bottom: 30px;
      }
.video {
        aspect-ratio: 16 / 9;
      }

      .unmute {
        width: 62%;
        min-height: 56%;
      }

      .speaker {
        font-size: 36px;
        margin-bottom: 12px;
      }

      .unmute-title {
        font-size: 24px;
      }
.call-section {
        padding-top: 45px;
      }

      .tab {
        min-width: min(400px, calc(100% - 34px));
        min-height: 68px;
        font-size: 30px;
      }

      h2 {
        font-size: 42px;
      }

      .steps {
        min-height: 96px;
        gap: 9px;
        font-size: 22px;
      }

      .dot {
        width: 12px;
        height: 12px;
        margin-right: 8px;
      }

      .form-body {
        padding: 34px 26px 34px;
      }

      .meeting-title {
        font-size: 31px;
      }

      .button {
        font-size: 18px;
      }
    }

    @media (max-width: 390px) {
      .confirmed-bar {
        font-size: 16px;
      }

      .wrap {
        width: calc(100% - 22px);
      }

      .call-wrap {
        width: calc(100% - 40px);
      }

      .kicker {
        font-size: 25px;
      }

      h1 {
        font-size: 35px;
      }
.tab {
        min-width: calc(100% - 30px);
        font-size: 27px;
      }

      h2 {
        font-size: 36px;
      }

      .steps {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="confirmed-bar">
    <span class="circle">✓</span>
    <span>Confirmed: REPORT REQUEST <span class="soft">RECEIVED</span></span>
  </div>

  <section class="hero">
    <div class="wrap">
      <p class="kicker">Your free pressure washing competitor ad report is being prepared...</p>

      <h1>
        <span>Watch this <em>quick message</em></span>
        <span>before your</span>
        <span>report walkthrough</span>
      </h1>
      <div class="video" id="videoBox">
        <iframe
          id="crabRavePlayer"
          title="Leadworks report walkthrough video"
          src="https://www.youtube-nocookie.com/embed/a5LV5D7Xlno?enablejsapi=1&autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>

        <button class="unmute" id="unmuteButton" type="button" aria-label="Click to unmute video">
          <div>
            <div class="speaker">🔊</div>
            <div class="unmute-title">Your Video Is Playing<br />Click To Unmute</div>
          </div>
        </button>
      </div>
    </div>
  </section>

  <section class="call-section">
    <div class="call-wrap">
      <div class="tab">Book My Report Walkthrough</div>

      <h2>See What Local Competitors Are Doing To Get More Pressure Washing Jobs</h2>
      <div class="iclosed-card">
        <!-- iClosed inline widget begin -->
        <div class="iclosed-widget" data-url="https://app.iclosed.io/e/leadworks/competitor-ad-report-walkthrough" title="Book Your 15-Minute Report Walkthrough" style="width: 100%; height: 620px"></div>
        <script type="text/javascript" src="https://app.iclosed.io/assets/widget.js" async></script>
        <!-- iClosed inline widget end -->
      </div>
    </div>
  </section>



  <script>
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("crabRavePlayer", {
        events: {
          onReady: function(event) {
            try {
              event.target.mute();
              event.target.playVideo();
            } catch (e) {}
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const unmuteButton = document.getElementById("unmuteButton");

      unmuteButton.addEventListener("click", function () {
        if (player && typeof player.unMute === "function") {
          player.seekTo(0, true);
          player.unMute();
          player.setVolume(100);
          player.playVideo();
        } else {
          const iframe = document.getElementById("crabRavePlayer");
          iframe.contentWindow.postMessage(JSON.stringify({
            event: "command",
            func: "seekTo",
            args: [0, true]
          }), "*");
          iframe.contentWindow.postMessage(JSON.stringify({
            event: "command",
            func: "unMute",
            args: []
          }), "*");
          iframe.contentWindow.postMessage(JSON.stringify({
            event: "command",
            func: "setVolume",
            args: [100]
          }), "*");
          iframe.contentWindow.postMessage(JSON.stringify({
            event: "command",
            func: "playVideo",
            args: []
          }), "*");
        }

        unmuteButton.classList.add("hidden");
      });
    });
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
